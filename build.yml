name: Build OpenNavBar WinX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Download OpenNavBar source
        run: |
          git clone --depth 1 https://github.com/BigBrotherTech/OpenNavBar.git opennavbar

      - name: Apply WinX patch
        run: |
          python3 patch_opennavbar.py

      - name: Build
        working-directory: opennavbar
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-debug
          path: opennavbar/**/build/outputs/apk/debug/*.apk
