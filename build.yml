name: Build OpenNavBar WinX edition

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official OpenNavBar source
        uses: actions/checkout@v4
        with:
          repository: ItsZariep/OpenNavBar
          ref: main
          path: opennavbar

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Win X auto-hide modification
        run: python3 patch_opennavbar.py opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt

      - name: Build debug APK
        working-directory: opennavbar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-debug
          path: opennavbar/app/build/outputs/apk/debug/*.apk
