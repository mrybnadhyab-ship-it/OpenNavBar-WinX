name: Build OpenNavBar WinX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WinX project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone OpenNavBar source
        run: |
          git clone https://codeberg.org/ItsZariep/OpenNavBar.git opennavbar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Gradle Wrapper
        working-directory: opennavbar
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Check OpenNavBar source
        run: |
          test -f opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt
          echo "NavigationOverlayService.kt found"

      - name: Apply WinX patch
        run: |
          python3 patch_opennavbar.py opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt

      - name: Build APK
        working-directory: opennavbar
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-debug
          path: opennavbar/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
