name: Build OpenNavBar WinX

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WinX project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clone OpenNavBar source
        run: |
          git clone https://codeberg.org/ItsZariep/OpenNavBar.git opennavbar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create Gradle Wrapper
        working-directory: opennavbar
        run: |
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

      - name: Check OpenNavBar source
        run: |
          test -f opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt
          echo "NavigationOverlayService.kt found"

      - name: Apply WinX patch
        run: |
          python3 patch_opennavbar.py \
            opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt

      - name: Build APK
        working-directory: opennavbar
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-debug
          path: opennavbar/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error        raise SystemExit(
            "Could not locate NavigationOverlayService class."
        )

    top_level_constant = (
        'private const val WINX_PACKAGE = '
        '"com.InternityLabs.Launcher.WinX"\n\n'
    )

    s = (
        s[:class_match.start()]
        + top_level_constant
        + s[class_match.start():]
    )


# ---------------------------------------------------------
# 2. Add WinX state variable inside the class.
# ---------------------------------------------------------

if 'private var isWinXLauncher = false' not in s:

    class_match = re.search(
        r'(class\s+NavigationOverlayService[^\{]*\{)',
        s
    )

    if not class_match:
        raise SystemExit(
            "Could not locate NavigationOverlayService class."
        )

    insert = (
        class_match.group(1)
        + '\n\n'
        + 'private var isWinXLauncher = false\n'
    )

    s = (
        s[:class_match.start()]
        + insert
        + s[class_match.end():]
    )


# ---------------------------------------------------------
# 3. Prevent the navigation overlay from being shown
#    while WinX is the foreground launcher.
# ---------------------------------------------------------

if 'if (isWinXLauncher) return' not in s:

    show_match = re.search(
        r'((?:private|public|protected|internal)?\s*'
        r'fun\s+showOverlayAnimated\s*'
        r'\([^)]*\)\s*\{)',
        s
    )

    if show_match:

        injection = (
            '\n'
            '        if (isWinXLauncher) return\n'
        )

        s = (
            s[:show_match.end()]
            + injection
            + s[show_match.end():]
        )


# ---------------------------------------------------------
# 4. Detect when WinX becomes the foreground application.
# ---------------------------------------------------------

if 'val nowWinX = foregroundPackage == WINX_PACKAGE' not in s:

    pos = s.find(
        'AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED'
    )

    if pos == -1:
        raise SystemExit(
            "Could not locate TYPE_WINDOW_STATE_CHANGED handling."
        )

    brace = s.find('{', pos)

    if brace == -1:
        raise SystemExit(
            "Could not locate event block."
        )

    code = '''
            val foregroundPackage = event.packageName?.toString()
            val nowWinX = foregroundPackage == WINX_PACKAGE

            if (nowWinX != isWinXLauncher) {
                isWinXLauncher = nowWinX

                if (nowWinX) {
                    hideOverlay()
                } else {
                    showOverlayAnimated()
                }
            }

'''

    s = s[:brace + 1] + code + s[brace + 1:]


# ---------------------------------------------------------
# 5. Write the patched Kotlin file.
# ---------------------------------------------------------

p.write_text(s, encoding="utf-8")

print("Patched:", p)# ---------------------------------------------------------

