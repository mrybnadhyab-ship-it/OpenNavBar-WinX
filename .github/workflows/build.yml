name: Build OpenNavBar WinX edition

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OpenNavBar WinX
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Patch OpenNavBar
        run: python3 patch_opennavbar.py

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-APK
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
