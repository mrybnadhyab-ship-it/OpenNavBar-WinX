name: Build OpenNavBar WinX edition

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout WinX patch project
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Clone OpenNavBar source
        run: |
          git clone --depth 1 https://codeberg.org/ItsZariep/OpenNavBar.git opennavbar

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Create Gradle wrapper
        working-directory: opennavbar
        run: |
          gradle wrapper

      - name: Check OpenNavBar source
        working-directory: opennavbar
        run: |
          echo "Gradle wrapper:"
          ls -la gradlew
          echo "Project files:"
          ls -la

      - name: Apply WinX modification
        run: |
          python3 patch_opennavbar.py \
            opennavbar/app/src/main/java/com/zariep/opennavbar/NavigationOverlayService.kt

      - name: Build APK
        working-directory: opennavbar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenNavBar-WinX-debug
          path: opennavbar/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
